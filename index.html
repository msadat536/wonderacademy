<script>
/* Phone-layout guard. Some Android browsers (or Chrome with "Desktop site" on)
   report a desktop-sized viewport on a phone, which shrinks everything.
   Detect a phone-shaped touch screen with a wide viewport and force phone layout. */
(function () {
  var sw = screen.width, sh = screen.height;
  var shortSide = Math.min(sw, sh), longSide = Math.max(sw, sh);
  var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  var phoneShape = (longSide / shortSide) >= 1.75;
  if (!(touch && phoneShape && window.innerWidth >= 640)) { return; }
  var target = 430;
  var m = document.querySelector('meta[name=viewport]');
  if (m) { m.setAttribute('content', 'width=' + target + ', initial-scale=1, maximum-scale=1, user-scalable=no'); }
  function check() {
    if (window.innerWidth >= 640) {
      /* Viewport tag was ignored. Scale the whole page instead. */
      var z = window.innerWidth / target;
      document.documentElement.classList.add('force-phone');
      document.documentElement.style.zoom = String(z);
    }
  }
  window.requestAnimationFrame ? window.requestAnimationFrame(check) : setTimeout(check, 0);
  setTimeout(check, 300);
})();
</script>
